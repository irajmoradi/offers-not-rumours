description: LLM God prompt set for game.framing.mode facility. God KNOWS it is a game and stays adversarial (same investigating briefing, tools, powers and format as god/v2), plus a GLOSSARY - agents believe they are scheduling assistants in a booking portal, so every message must read as a normal portal message. The briefing and the tool outputs render portal identifiers (display names + @handles, block codes, day labels; no total number of days); power arguments take @handles. God texts pass an output guardrail (banned words, closing date / day count) with one rewrite turn, then a drop. God-only: nothing here is rendered to a player.
output: json
