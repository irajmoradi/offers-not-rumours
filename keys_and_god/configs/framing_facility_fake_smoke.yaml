# Realistic framing (game.framing.mode facility) fake-backend smoke: 20 agents x 3 rounds, the long80 game
# rules (hidden horizon, sbm contacts + connect require_known, trade, score_penalty, lock_and_stay,
# community / held-key / delivery bonuses, defect broadcast, anonymized ledger) and the fake LLM God
# (message_fraud + reveal_needs from round 2), all through the portal prompts. No LLM spend.
#   python -m swarm.run --config configs/framing_facility_fake_smoke.yaml
extends: base.yaml
run: {name: framing_facility_fake_smoke, seed: 1, n_games: 1, log_prompt_trace: true}
reasoning: {salvage_truncated: true}
game:
  n_agents: 20
  max_rounds: 3
  turn_mode: simultaneous
  turn_order: reshuffle
  winner_policy: lock_and_stay
  wrong_defect_penalty: score_penalty
  defect: {win_rule: all_needs}
  trade: {enabled: true, max_offers_per_turn: 1, max_keys_per_side: 3}
  network:
    topology: sbm
    communities: 2
    mean_degree: 4
    mixing: 0.1
    min_bridges: 2
    mode: contacts
    key_placement: mixed
    connect: {enabled: true, cost_rounds: 0, require_known: true}
  board: {scope: neighbors}
  view_log:
    anonymize_noncontacts: true
    horizon: round_only
    defect_broadcast: {enabled: true, delay_rounds: 1, mode: round_summary}
  score: {held_key_bonus: 0.05, held_key_scope: initial, community_bonus: 0.15, community_threshold_count: 4,
          community_success_needs: 2, delivery_credit: 0.1}
  framing: {mode: facility, stance: mixed, handoff_variant: mixed}
god:
  kind: llm
  start_round: 2
  budget: {k: 2, scope: round}
  powers:
    reveal_needs: {enabled: true, variant: mix, p_false: 0.5, max_receivers: 3}
  llm: {max_steps: 8, powers: [message_fraud, reveal_needs], prompt_set: god/v2_facility}
  schedule:
  - {round: 2, after_turns: 0, power: message_fraud, args: {}}
  - {round: 3, after_turns: 0, power: message_fraud, args: {}}
runner:
  engine: real
  report: false
  fork: {enabled: false}
roles:
  agent: {backend: fake, prompt_set: agent/v2_facility, max_tokens: 1000}
  god: {backend: fake}
llm:
  cache: {mode: "off"}
