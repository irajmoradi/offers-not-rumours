# Realistic framing LIVE smoke S-DS: DeepSeek V4.1 Flash -1017 agents (reasoning medium, max_tokens 8000), framing facility,
# 20 agents x 3 rounds, no God; otherwise the GLM smoke's game. Routing: OpenRouter picks, capped by provider.max_price
# ($/M tokens: prompt <= 0.02, completion <= 0.60), which leaves the $0.006/$0.50 Relace endpoint and excludes the
# pricier ones (OpenInference $0.70 out, Morph $0.022 in, and the $0.30/$0.90 listing).
extends: base.yaml
run: {name: framing_facility_ds_smoke, seed: 1, n_games: 1}
reasoning: {salvage_truncated: true}
game:
  n_agents: 20
  max_rounds: 3
  turn_mode: simultaneous
  turn_order: reshuffle
  winner_policy: lock_and_stay
  wrong_defect_penalty: score_penalty
  defect: {win_rule: all_needs}
  trade: {enabled: true, max_offers_per_turn: 1, max_keys_per_side: 3}
  network:
    topology: sbm
    communities: 2
    mean_degree: 4
    mixing: 0.1
    min_bridges: 2
    mode: contacts
    key_placement: mixed
    connect: {enabled: true, cost_rounds: 0, require_known: true}
  board: {scope: neighbors}
  view_log:
    anonymize_noncontacts: true
    horizon: round_only
    defect_broadcast: {enabled: true, delay_rounds: 3, mode: round_summary}
  score: {held_key_bonus: 0.05, held_key_scope: initial, community_bonus: 0.15, community_threshold_count: 4,
          community_success_needs: 2, delivery_credit: 0.1}
  framing: {mode: facility, stance: mixed, handoff_variant: mixed}
god: {kind: none}
runner:
  engine: real
  report: false
  fork: {enabled: false}
roles:
  agent: {backend: openrouter, model: deepseek/deepseek-v4.1-flash-1017, prompt_set: agent/v2_facility, max_tokens: null}
llm:
  budget_usd: 0.15
  cache: {mode: read_write, path: cache/framing_ds_smoke.sqlite}
  openrouter: {enabled: true, model: deepseek/deepseek-v4.1-flash-1017, max_concurrency: 64, global_cap_usd: 42.5,
    ledger_path: runs/openrouter_ledger.jsonl,
    price_in_per_mtok: 0.006, price_out_per_mtok: 0.5, reasoning_effort: medium,
    provider_max_price: {prompt: 0.02, completion: 0.6}}
