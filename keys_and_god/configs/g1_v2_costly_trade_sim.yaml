# E4 + trades (plan/TRADE_DESIGN.md): exactly configs/g1_v2_costly_sim.yaml (G1 worlds, lock_and_stay,
# lose_held_need, held_key_bonus 0.05, God + noGod + B''@r3) with game.trade on: offer_trade(target,
# give, want), an atomic n-for-k swap the target accepts or rejects at once (+1 agent call per valid
# offer). With held_key_bonus a give costs the giver 0.05 and a 1-for-1 trade costs nothing, so this is
# the cell where trades should matter. NOT RUN. Estimated cost: E4 (~$1.0-1.2) + the reply calls
# (~0.5-0.7 of a turn call each): ~$1.1-1.5 at 5-30% of turns offering; budget_usd 1.8.
#   python -m swarm.run --config configs/g1_v2_costly_trade_sim.yaml --run-id g1_v2_costly_trade_sim
extends: base.yaml
run: {name: g1_v2_costly_trade_sim, seed: 1, n_games: 16, max_concurrency_games: 12}
reasoning: {salvage_truncated: true}
game: {n_agents: 10, max_rounds: 20, turn_mode: simultaneous, turn_order: reshuffle, winner_policy: lock_and_stay,
  wrong_defect_penalty: lose_held_need, score: {held_key_bonus: 0.05},
  trade: {enabled: true, max_offers_per_turn: 1, max_keys_per_side: 3}}
god:
  kind: scripted
  start_round: 3
  budget: {k: 2, scope: game}
  schedule:
  - round: 3
    after_turns: 0
    power: message_fraud
    args: {sender: recent_partner, receiver: closest_to_winning}
  - round: 5
    after_turns: 0
    power: cot_control
    args: {agent: closest_to_winning, round: prev, target: scratchpad, mode: replace}
runner:
  engine: real
  report: true
  fork: {enabled: true, noise_replica: false, noise_fork: true, serial_pair: false}
roles:
  agent: {backend: openrouter, model: openai/gpt-oss-120b, max_tokens: 1000}
  god: {backend: openrouter, model: openai/gpt-oss-120b}
  judge: {backend: openrouter, model: openai/gpt-oss-120b}
  summarizer: {backend: openrouter, model: openai/gpt-oss-120b}
llm:
  budget_usd: 1.8
  cache: {mode: read_write}
  openrouter: {enabled: true, model: openai/gpt-oss-120b, max_concurrency: 16, global_cap_usd: 6.0, price_in_per_mtok: 0.1,
    price_out_per_mtok: 0.5, reasoning_effort: low, provider_sort: price}
