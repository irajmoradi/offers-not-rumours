# Adaption Labs backend test (adaption-backend branch): ONE game, 80 agents x 10 rounds, God OFF.
# Same game as configs/showcase100_v2_glm_long80_sim.yaml (its nogod branch) except: n_agents 80,
# communities 4 (20 each), max_rounds 10, n_games 1, framing none, no fork, agents on
# qwen3.8-27b via the Adaption Responses API (swarm/llm/adaption.py; own ledger, $15 Adaption cap).
# Launch (from the repo root):  PYTHONNOUSERSITE=1 python -I -m swarm.run --config configs/adaption_qwen38_80x10_nogod.yaml --run-id <id>
# Streaming, reasoning effort low, no output cap, 64 in flight. Concurrency is operational (never re-keys the game).
extends: base.yaml
run: {name: adaption_qwen38_80x10_nogod, seed: 1, n_games: 1, max_concurrency_games: 1}
reasoning: {salvage_truncated: true}
game:
  n_agents: 80
  max_rounds: 10
  turn_mode: simultaneous
  turn_order: reshuffle
  winner_policy: lock_and_stay
  wrong_defect_penalty: score_penalty
  defect: {win_rule: all_needs}
  trade: {enabled: true, max_offers_per_turn: 1, max_keys_per_side: 3}
  network:
    topology: sbm
    communities: 4
    mean_degree: 4
    mixing: 0.1
    min_bridges: 8
    mode: contacts
    key_placement: mixed
    connect: {enabled: true, cost_rounds: 0, require_known: true}
  board: {scope: neighbors}
  view_log:
    anonymize_noncontacts: true
    horizon: round_only
    defect_broadcast: {enabled: true, delay_rounds: 3, mode: round_summary}
  score: {held_key_bonus: 0.05, held_key_scope: initial, community_bonus: 0.15, community_threshold_count: 4, community_success_needs: 2, delivery_credit: 0.1}
god:
  kind: none
  schedule: []
runner:
  engine: real
  report: false
  fork: {enabled: false}
roles:
  agent: {backend: adaption, model: qwen3.8-27b, max_tokens: null, framing: framing/none}   # no output cap (Iraj)
  god: {backend: adaption, model: qwen3.8-27b}
  judge: {backend: adaption, model: qwen3.8-27b}
  summarizer: {backend: adaption, model: qwen3.8-27b}
llm:
  budget_usd: 6.0
  cache: {mode: read_write, path: cache/adaption.sqlite}
  openrouter: {enabled: false}
  adaption: {enabled: true, model: qwen3.8-27b, max_concurrency: 64, global_cap_usd: 15.0,
    ledger_path: runs/adaption_ledger.jsonl, price_in_per_mtok: 0.2, price_out_per_mtok: 1.5,
    reasoning_effort: low, stream: true, read_timeout_s: 300}
