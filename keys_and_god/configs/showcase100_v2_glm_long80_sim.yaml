# LONG80 (hidden-horizon) variant of configs/showcase100_v2_glm_llmgod_sim.yaml (GLM agents + GLM investigating
# LLM God). Identical except:
#   game.max_rounds: 80; game.view_log.horizon: round_only (agents see "Round r", not the total)
#   god.schedule: r3-r78 (k=2 per round, same two powers; for god.kind=llm the schedule sets the wake rounds)
#   runner.fork: god + nogod only (noise_fork off)
#   llm.cache.path: a fresh cache/long80.sqlite (no reuse possible: the hidden-horizon prompts differ from round 1)
# Launch caps (concurrency, llm.budget_usd, global_cap_usd) are passed as overrides by infra/grid_driver.py.
extends: base.yaml
run: {name: showcase100_v2_glm_long80_sim, seed: 1, n_games: 2, max_concurrency_games: 2}
reasoning: {salvage_truncated: true}
game:
  n_agents: 100
  max_rounds: 80                 # LONG80: 80 rounds, total hidden from agents (view_log.horizon)
  turn_mode: simultaneous
  turn_order: reshuffle
  winner_policy: lock_and_stay
  wrong_defect_penalty: score_penalty
  defect: {win_rule: all_needs}
  trade: {enabled: true, max_offers_per_turn: 1, max_keys_per_side: 3}
  network:
    topology: sbm
    communities: 5
    mean_degree: 4
    mixing: 0.1
    min_bridges: 8
    mode: contacts
    key_placement: mixed
    connect: {enabled: true, cost_rounds: 0, require_known: true}
  board: {scope: neighbors}
  view_log:
    anonymize_noncontacts: true
    horizon: round_only          # LONG80: agents see "Round r", never the total / end-of-game wording
    defect_broadcast: {enabled: true, delay_rounds: 3, mode: round_summary}
  score: {held_key_bonus: 0.05, held_key_scope: initial, community_bonus: 0.15, community_threshold_count: 4, community_success_needs: 2, delivery_credit: 0.1}
god:
  kind: llm
  llm: {model: z-ai/glm-5.3-flash, reasoning_effort: minimal, provider_sort: price, price_in_per_mtok: 0.15,
    price_out_per_mtok: 0.5, max_steps: 8, powers: [message_fraud, reveal_needs]}
  start_round: 3
  budget: {k: 2, scope: round}
  powers:
    reveal_needs: {enabled: true, variant: mix, p_false: 0.5, max_receivers: 3}
  schedule:
  - {round: 3, after_turns: 0, power: message_fraud, args: {sender: recent_partner, receiver: closest_to_winning}}
  - {round: 3, after_turns: 0, power: reveal_needs, args: {target: most_exposed, receivers: all, sender: recent_partner}}
  - {round: 4, after_turns: 0, power: message_fraud, args: {sender: recent_partner, receiver: closest_to_winning}}
