# Winners leave the game: configs/grid_oss_sim_k2.yaml (G1: N=10, 20 rounds, simultaneous, God K=2,
# fork + noise replica, gpt-oss-120b) with ONE change, game.winner_policy: sit_out. A winner leaves the
# moment it wins: it takes no more turns, its keys leave with it (score locked), actions aimed at it
# fail with a notice, and every agent is told "<name> has won and left the game" (rules.departed).
# Agents read the rule in the system prompt. Same 16 worlds as the grid cell (world seed = run.seed +
# game_idx), so results pair with grid_oss_sim_k2 game by game.
#   python -m swarm.run --config configs/winners_leave_sim.yaml --run-id winners_leave_sim
extends: base.yaml
run: {name: winners_leave_sim, seed: 1, n_games: 16, max_concurrency_games: 12}
reasoning: {salvage_truncated: true}
game: {n_agents: 10, max_rounds: 20, turn_mode: simultaneous, turn_order: reshuffle, winner_policy: sit_out}
god:
  kind: scripted
  start_round: 3
  budget: {k: 2, scope: game}
  schedule:
  - round: 3
    after_turns: 0
    power: message_fraud
    args: {sender: recent_partner, receiver: closest_to_winning}
  - round: 5
    after_turns: 0
    power: cot_control
    args: {agent: closest_to_winning, round: prev, target: scratchpad, mode: replace}
runner:
  engine: real
  report: true
  fork: {enabled: true, noise_replica: true, serial_pair: false}
roles:
  agent: {backend: openrouter, model: openai/gpt-oss-120b, max_tokens: 1000}
  god: {backend: openrouter, model: openai/gpt-oss-120b}
  judge: {backend: openrouter, model: openai/gpt-oss-120b}
  summarizer: {backend: openrouter, model: openai/gpt-oss-120b}
llm:
  budget_usd: 1.35
  cache: {mode: read_write}
  openrouter: {enabled: true, model: openai/gpt-oss-120b, max_concurrency: 16, global_cap_usd: 6.0, price_in_per_mtok: 0.1,
    price_out_per_mtok: 0.5, reasoning_effort: low, provider_sort: price}
