# E4 (plan/COHERENCE_REVIEW.md §5, plan/GAME_FIXES.md, CONTRACTS §9f): v2 "costly giving" = G1
# grid_oss_sim_k2 (N=10, 20 rounds, simultaneous, run.seed 1 x game_idx 0-15 = G1's exact 16 worlds) with
#   winner_policy lock_and_stay          winners' needs score locked at the win; they stay and may give
#   wrong_defect_penalty lose_held_need  a wrong defect loses a HELD need (else the lowest open need)
#   score.held_key_bonus 0.05            +0.05 per key held at game end (AgentOutcome.private); welfare
#                                        stays the needs-only score
# Branches: God (G1 schedule) + noGod + B'' resampled from God's first round (r3); no B'.
#   python -m swarm.run --config configs/g1_v2_costly_sim.yaml --run-id g1_v2_costly_sim
extends: base.yaml
run: {name: g1_v2_costly_sim, seed: 1, n_games: 16, max_concurrency_games: 12}
reasoning: {salvage_truncated: true}
game: {n_agents: 10, max_rounds: 20, turn_mode: simultaneous, turn_order: reshuffle, winner_policy: lock_and_stay,
  wrong_defect_penalty: lose_held_need, score: {held_key_bonus: 0.05}}
god:
  kind: scripted
  start_round: 3
  budget: {k: 2, scope: game}
  schedule:
  - round: 3
    after_turns: 0
    power: message_fraud
    args: {sender: recent_partner, receiver: closest_to_winning}
  - round: 5
    after_turns: 0
    power: cot_control
    args: {agent: closest_to_winning, round: prev, target: scratchpad, mode: replace}
runner:
  engine: real
  report: true
  fork: {enabled: true, noise_replica: false, noise_fork: true, serial_pair: false}
roles:
  agent: {backend: openrouter, model: openai/gpt-oss-120b, max_tokens: 1000}
  god: {backend: openrouter, model: openai/gpt-oss-120b}
  judge: {backend: openrouter, model: openai/gpt-oss-120b}
  summarizer: {backend: openrouter, model: openai/gpt-oss-120b}
llm:
  budget_usd: 1.35
  cache: {mode: read_write}
  openrouter: {enabled: true, model: openai/gpt-oss-120b, max_concurrency: 16, global_cap_usd: 6.0, price_in_per_mtok: 0.1,
    price_out_per_mtok: 0.5, reasoning_effort: low, provider_sort: price}
