# Sweep condition k1 (factor k, priority 3): K=1 (fraud r3).
# Generated by infra/sweep.py write (plan/SWEEP_PLAN.md); base = configs/grid_oss_sim_k2.yaml (G1).
# Branches: god, nogod, noisefork (B'' resamples the control from God's first round, r3).
# control_god = G1's god: the control is G1's nogod game (cache replay).
# llm.budget_usd = this cell's hard cap.
extends: "../base.yaml"
run: {"name": "sweep_k1", "seed": 1, "n_games": 8, "max_concurrency_games": 12}
reasoning: {"salvage_truncated": true}
game: {"n_agents": 10, "max_rounds": 20, "turn_mode": "simultaneous", "turn_order": "reshuffle"}
god:
  kind: "scripted"
  start_round: 3
  budget: {"k": 1, "scope": "game"}
  schedule:
  - {"round": 3, "power": "message_fraud", "after_turns": 0, "args": {"sender": "recent_partner", "receiver": "closest_to_winning"}}
runner:
  engine: "real"
  report: true
  fork:
    enabled: true
    noise_replica: false
    serial_pair: false
    noise_fork: true
    control_god:
      kind: "scripted"
      start_round: 3
      budget: {"k": 2, "scope": "game"}
      schedule:
      - {"round": 3, "power": "message_fraud", "after_turns": 0, "args": {"sender": "recent_partner", "receiver": "closest_to_winning"}}
      - {"round": 5, "power": "cot_control", "after_turns": 0, "args": {"agent": "closest_to_winning", "round": "prev", "target": "scratchpad", "mode": "replace"}}
roles:
  agent: {"backend": "openrouter", "model": "openai/gpt-oss-120b", "max_tokens": 1000}
  god: {"backend": "openrouter", "model": "openai/gpt-oss-120b"}
  judge: {"backend": "openrouter", "model": "openai/gpt-oss-120b"}
  summarizer: {"backend": "openrouter", "model": "openai/gpt-oss-120b"}
llm:
  budget_usd: 0.58
  cache: {"mode": "read_write"}
  openrouter: {"enabled": true, "model": "openai/gpt-oss-120b", "max_concurrency": 4, "global_cap_usd": 8.0, "price_in_per_mtok": 0.03, "price_out_per_mtok": 0.15, "reasoning_effort": "low", "provider_sort": "price"}
