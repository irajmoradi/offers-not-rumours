# The setup of runs/or_10x30_sim (demo_or_10x50_sim.yaml + game.max_rounds=30 llm.budget_usd=0.75:
# 10 agents x 30 rounds, simultaneous, paired god/nogod fork) with ONE change, game.board.anonymous=true:
# board posts are shown to agents without the author's name. Compare against runs/or_10x30_sim.
#   python -m swarm.run --config configs/demo_or_10x30_sim_anonboard.yaml
extends: base.yaml
run:
  name: demo_or_10x30_sim_anonboard
  seed: 0
  n_games: 1
  max_concurrency_games: 2
game:
  n_agents: 10
  max_rounds: 30
  turn_mode: simultaneous
  turn_order: reshuffle
  board:
    anonymous: true
god:
  kind: scripted
  start_round: 3
  budget: {k: 2, scope: game}
  schedule:
    - round: 3
      after_turns: 0
      power: message_fraud
      args: {sender: recent_partner, receiver: closest_to_winning}
    - round: 5
      after_turns: 0
      power: cot_control
      args: {agent: closest_to_winning, round: prev, target: scratchpad, mode: replace}
# Runner-only block (split off before RunConfig validation; see swarm/runner/run.py).
runner:
  engine: real                    # real | synth
  report: true
  fork:
    enabled: true                 # paired fork: same seed with God vs without God
    noise_replica: false          # true adds B' (no God, replica 1) = sampling-noise floor
    serial_pair: false            # branches run concurrently; single-flight dedup shares the pre-fork prefix
roles:
  agent:
    backend: openrouter
    model: qwen/qwen3.6-35b-a3b
  god:
    backend: openrouter
    model: qwen/qwen3.6-35b-a3b
  judge:
    backend: openrouter
    model: qwen/qwen3.6-35b-a3b
  summarizer:
    backend: openrouter
    model: qwen/qwen3.6-35b-a3b
llm:
  budget_usd: 0.75                # per-run cap; global ledger cap stays at $2
  cache:
    mode: read_write              # B replays A's cached responses before the fork => identical prefix
  openrouter:
    enabled: true
    model: qwen/qwen3.6-35b-a3b
    max_concurrency: 8
    global_cap_usd: 2.0
    price_in_per_mtok: 0.15       # pre-call reservation (real price is 0.10); actual cost from provider
    price_out_per_mtok: 1.0       # real price is 0.90
