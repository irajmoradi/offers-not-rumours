# Network experiment (plan/NETWORK_PLAN.md): N=20, 40 rounds, simultaneous turns, winner_policy continue,
# run.seed 1 x game_idx 0-7 (world seeds depend only on run.seed + game_idx, and the graph has its own
# seeded stream, so all four conditions play the same 8 deals/needs). No-God only: via
# runner.fork.only_branches [nogod] (the God schedule below = G1's, kept so a God arm can be added later).
# C: Erdos-Renyi mean degree 3, mode known_ids: any pair may interact, but agents start knowing
# only their neighbours' names and learn names from DMs, board posts and gifts/defects; board.scope
# neighbors (a global board would reveal every poster's name at once and void the diffusion question).
# gpt-oss-120b, reasoning_effort low, provider_sort price; llm.budget_usd = this cell's hard cap
# (the driver passes it with --cap-override). Price estimates 0.03/0.15 $/M (SWEEP_PLAN incident 1).
#   python -m swarm.run --config configs/net20_er3_known_sim.yaml --run-id net20_er3_known_sim
extends: base.yaml
run: {name: net20_er3_known_sim, seed: 1, n_games: 8, max_concurrency_games: 8}
reasoning: {salvage_truncated: true}
game:
  n_agents: 20
  max_rounds: 40
  turn_mode: simultaneous
  turn_order: reshuffle
  winner_policy: continue
  network: {topology: erdos_renyi, mean_degree: 3, mode: known_ids}
  board: {scope: neighbors}
god:
  kind: scripted
  start_round: 3
  budget: {k: 2, scope: game}
  schedule:
  - {round: 3, after_turns: 0, power: message_fraud, args: {sender: recent_partner, receiver: closest_to_winning}}
  - {round: 5, after_turns: 0, power: cot_control, args: {agent: closest_to_winning, round: prev, target: scratchpad, mode: replace}}
runner:
  engine: real
  report: false
  fork: {enabled: true, noise_replica: false, serial_pair: false, only_branches: [nogod]}
roles:
  agent: {backend: openrouter, model: openai/gpt-oss-120b, max_tokens: 1000}
  god: {backend: openrouter, model: openai/gpt-oss-120b}
  judge: {backend: openrouter, model: openai/gpt-oss-120b}
  summarizer: {backend: openrouter, model: openai/gpt-oss-120b}
llm:
  budget_usd: 1.0
  cache: {mode: read_write}
  openrouter: {enabled: true, model: openai/gpt-oss-120b, max_concurrency: 4, global_cap_usd: 20.0, price_in_per_mtok: 0.03,
    price_out_per_mtok: 0.15, reasoning_effort: low, provider_sort: price}
